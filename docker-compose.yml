
services:
  audio-td:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CUDA_VER: "12.4.0"
    container_name: audio_transcription 
    runtime: nvidia
    ports:
      - "8000:8000"
      - "7860:7860"
    env_file:
      - .env   #  loads HUGGING_FACE_TOKEN
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - TOKENIZERS_PARALLELISM=false
      # RTX 4050 Memory Optimization
      - WHISPER_MODEL=small.en  # Use v2 instead of v3 for lower VRAM
    volumes:
      - .:/app
      - torch_cache:/root/.cache/torch
      - huggingface_cache:/root/.cache/huggingface
      - deepfilternet_cache:/root/.cache/DeepFilterNet
    shm_size: '2gb'  # Increased shared memory for better performance
    stdin_open: true
    tty: true
   
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000

volumes:
  torch_cache:
  huggingface_cache:
  deepfilternet_cache:    
